name: build
on: push
permissions:
  packages: write
  contents: write
jobs:
  build:
    name: "Build Dungeondraft-GoPackager (${{ matrix.target.os }}, ${{ matrix.go-version }})"
    runs-on: ${{ matrix.target.host || 'ubuntu-latest' }}
    env:
      GO111MODULE: on
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.27.x"]
        target:
          - os: linux
          - os: windows
            ext: .exe
            host: windows-latest
          - os: darwin
            host: macos-latest
    steps:
      - name: Setup Go environment
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Force "autocrlf"
        run: git config --global core.autocrlf input
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/fyne-cross
          key: ${{ runner.os }}-build-cache-${{ hashFiles('**/go.sum') }}

      - name: Install Build Deps (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Install Fyne
        run: |
          go install fyne.io/tools/cmd/fyne@latest
      - name: install go deps
        run: go mod download
      - name: Build Gui (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          cp FyneApp.toml ./cmd/dungeondraft-packager
          fyne package -os windows -src ./cmd/dungeondraft-packager --release -app-id io.github.ryex.dungeondraft-gopackager
      - name: Build Gui (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          cp FyneApp.toml ./cmd/dungeondraft-packager
          fyne package -os linux -src ./cmd/dungeondraft-packager --release -app-id io.github.ryex.dungeondraft-gopackager
      - name: Build Gui (MacOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          mkdir -p bin
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o ./bin/dungeondraft-packager-amd64 ./cmd/dungeondraft-packager
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o ./bin/dungeondraft-packager-arm64 ./cmd/dungeondraft-packager
          lipo -create -output dungeondraft-packager ./bin/dungeondraft-packager-amd64 ./bin/dungeondraft-packager-arm64
          file dungeondraft-packager
          rm -r ./bin
          fyne package -os darwin -exe ./dungeondraft-packager --release --icon ./cmd/dungeondraft-packager/Icon.png -app-id io.github.ryex.dungeondraft-gopackager
      - name: Build Cli (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          go build -ldflags "-s -w" ./cmd/dungeondraft-packager-cli
      - name: Build Cli (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          go build -ldflags "-s -w" ./cmd/dungeondraft-packager-cli
      - name: Build Cli (MacOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          mkdir -p bin
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o ./bin/dungeondraft-packager-cli-amd64 ./cmd/dungeondraft-packager-cli
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o ./bin/dungeondraft-packager-cli-arm64 ./cmd/dungeondraft-packager-cli
          lipo -create -output dungeondraft-packager-cli ./bin/dungeondraft-packager-cli-amd64 ./bin/dungeondraft-packager-cli-arm64
          file dungeondraft-packager-cli
          rm -r ./bin
      - name: List dir
        run: |
          ls .
          ls ./cmd/dungeondraft-packager

      - name: Prep artifacts (Windows)
        if: ${{ runner.os == 'windows' }}
        run: |
          mkdir install
          cp "./cmd/dungeondraft-packager/Dungeondraft GoPackager.exe" ./install
          cp "./dungeondraft-packager-cli.exe" ./install
          cp *.md ./install
          ls -r ./install

      - name: Prep artifacts (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          mkdir install
          # fyne >= 1.7.1 nests the package content (Makefile and usr/) under a
          # single top level directory instead of extracting a tarbomb into the
          # current directory ("Don't make tarbombs", fyne-io/tools#105). Keep
          # that layout and put our extra files there too, so the release
          # archive also extracts into one directory.
          tar -xJf "./Dungeondraft GoPackager.tar.xz" -C ./install
          cp ./dungeondraft-packager-cli ./install/dungeondraft-packager/usr/local/bin
          # add the CLI to the install target of the generated Makefile
          sed -i '/^install:/a\\tinstall -Dm00755 usr/local/bin/$(Exec)-cli $(DESTDIR)$(PREFIX)/bin/$(Exec)-cli' ./install/dungeondraft-packager/Makefile
          cp *.md ./install/dungeondraft-packager
          ls -r ./install
          ldd ./install/dungeondraft-packager/usr/local/bin/dungeondraft-packager

      - name: Prep artifacts (MacOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          mkdir install
          mkdir prep
          ls -lah .
          cp -r "./Dungeondraft GoPackager.app" ./prep
          cp ./dungeondraft-packager* ./prep
          cp *.md ./prep
          mkdir "./prep/Dungeondraft GoPackager.app/Contents/Frameworks"
          ls -lah ./prep
          ls -r "./prep/Dungeondraft GoPackager.app"
          otool -L "./prep/Dungeondraft GoPackager.app/Contents/MacOS/dungeondraft-packager"
          ditto -c -k --sequesterRsrc  "./prep" "./install/Dungeondraft-GoPackager.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dungeondraft-GoPackager-${{ runner.os }}
          path: install/**

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
      CGO_ENABLED: 1
    steps:
      - name: Setup Go environment
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Force "autocrlf"
        run: git config --global core.autocrlf input
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Build Deps
        # the GUI packages link against OpenGL, so the GL and X11 headers are
        # needed to build them. No display is required, the tests use the
        # software renderer of fyne.io/fyne/v2/test.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev


      - name: Run tests
        run: go test ./...

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: List dir
        run: ls
      - name: Package
        run: |
          pushd Dungeondraft-GoPackager-Linux ; tar -czf ../Dungeondraft-GoPackager-Linux.tar.gz * ; popd
          pushd Dungeondraft-GoPackager-macOS ; cp ./Dungeondraft-GoPackager.zip ../Dungeondraft-GoPackager-macOS.zip ; popd
          pushd Dungeondraft-GoPackager-Windows ; zip -r ../Dungeondraft-GoPackager-Windows.zip * ; popd
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: Dungeondraft-GoPackager-Linux/dungeondraft-packager/CHANGELOG.md
          draft: true
          files: |
            Dungeondraft-GoPackager-Linux.tar.gz
            Dungeondraft-GoPackager-macOS.zip
            Dungeondraft-GoPackager-Windows.zip
